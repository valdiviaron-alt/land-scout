services:
  - type: web
    name: land-scout-rrv
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: APP_NAME
        value: Land Scout
      - key: APP_DOMAIN
        value: landscout.rrvconstruction.com
      - key: APP_BRAND
        value: RRV Construction
